[package]
name = "toc"
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "TUI Object Converter for local text and byte transformations"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
clap = { version = "4.6.4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
html-escape = { version = "=0.2.15", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "unbounded_depth"] }
sha2 = { version = "=0.11.0", default-features = false }
tui-textarea = { package = "tui-textarea-2", version = "0.12.1", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
