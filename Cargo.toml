[package]
name = "doop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Local text transformations for the command line and terminal"

[dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "unbounded_depth"] }
